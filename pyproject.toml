[project]
name = "craft_dl"
version = "0.1.0"
description = "Archive the storytold/*craft repositories: git history plus release assets."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cyclopts>=3.0",
    "githubkit>=0.12",
    "rich>=13.0",
]

[project.scripts]
craft_dl = "craft_dl.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["craft_dl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
